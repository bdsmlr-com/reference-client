<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDSMLR - Developer Reference Client</title>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // --- A/B arm (ix1) before first page_view. Bridge reads globalThis.SITE_AB_IX ---
    // Sticky bucket in localStorage (tracking). Once-per-session suppress lives in the bridge.
    var abIx = Math.random() < 0.5 ? 'A' : 'B';
    try {
      var abStored = localStorage.getItem('site_ab_ix');
      if (/^[AB]$/.test(abStored)) {
        abIx = abStored;
      } else {
        localStorage.setItem('site_ab_ix', abIx);
      }
    } catch (ee) { /* no localStorage */}
    globalThis.SITE_AB_IX = abIx;
    gtag('set', 'user_properties', { ab_ix: abIx });
    // --- logged_in hint for first page_view (see ga-logged-in-hint.ts) ---
    globalThis.GA_LOGGED_IN_STORAGE_KEY = 'site_ga_logged_in';
    var loggedIn = 'false';
    try {
      var stored = localStorage.getItem(globalThis.GA_LOGGED_IN_STORAGE_KEY);
      if (stored === 'true' || stored === 'false') loggedIn = stored;
    } catch (e) {}
    dataLayer.push({ logged_in: loggedIn });
    gtag('js', new Date());
    gtag('config', 'G-9VSP3HR9NF', { logged_in: loggedIn });
    // Rough boot watchdog: fire if the main app module hasn't loaded yet.
    // 5s is coarse on purpose — slower than in-app outage_slow_request (3s),
    // tight enough that a hung/missing bundle still shows up.
    var SLOW_LOADING_APP_MS = 5000;
    globalThis.__slowLoadingAppTimer = setTimeout(function () {
      gtag('event', 'slow_loading_app', {
        timeout_ms: SLOW_LOADING_APP_MS,
        logged_in: loggedIn,
        page_path: location.pathname,
        page_location: location.href
      });
    }, SLOW_LOADING_APP_MS);
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9VSP3HR9NF"></script>
  <!-- Inline theme initialization to prevent FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      var theme = localStorage.getItem('bdsmlr_theme');
      if (!theme || (theme !== 'dark' && theme !== 'light')) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* Critical CSS to prevent FOUC - matches theme.ts variables */
    :root, [data-theme="dark"] {
      --bg-primary: #0f172a;
      --text-primary: #e2e8f0;
    }
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --text-primary: #0f172a;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <script src="/v2/assets/interstitial-tabunder.js?v5"></script>
  <app-root></app-root>
  <script type="module" src="/src/app-root.ts" onload="clearTimeout(globalThis.__slowLoadingAppTimer)"></script>
</body>
</html>
